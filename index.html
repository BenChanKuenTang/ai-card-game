<!DOCTYPE html>
<html lang="zh-HK">
<head>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        .game-container {
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header h1 {
            font-size: 1.6rem;
            color: #d63384;
            margin-bottom: 4px;
        }

        header p {
            font-size: 0.85rem;
            color: #666;
        }

        /* 玩家設定區塊 */
        .setup-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #ffccd5;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #ff4d6d;
        }

        .player-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            min-height: 32px;
        }

        .player-chip {
            background: #ffe6eb;
            color: #d63384;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.85rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .player-chip span {
            cursor: pointer;
            color: #ff4d6d;
            font-weight: bold;
        }

        /* 遊戲資訊與卡牌區塊 */
        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: #fff0f5;
            padding: 10px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.95rem;
            color: #d63384;
        }

        .target-player-box {
            background: #ff4d6d;
            color: white;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            display: none;
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .card-wrapper {
            perspective: 1000px;
            width: 100%;
            height: 260px;
        }

        .card {
            width: 100%;
            height: 100%;
            background: #ffffff;
            border: 3px solid #ffccd5;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-shadow: 0 8px 16px rgba(220, 53, 69, 0.1);
            position: relative;
        }

        .card-tag {
            position: absolute;
            top: 14px;
            left: 14px;
            background: #ff758f;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .card-content {
            font-size: 1.2rem;
            line-height: 1.5;
            font-weight: 600;
            color: #2b2b2b;
            word-break: break-word;
        }

        /* 按鈕區塊 */
        .btn-group {
            display: flex;
            gap: 10px;
            flex-direction: column;
        }

        .btn {
            background: linear-gradient(45deg, #ff4d6d, #ff758f);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1.05rem;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 77, 109, 0.3);
            transition: transform 0.1s ease, opacity 0.2s ease;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-add {
            background: #ff4d6d;
            padding: 0 16px;
            box-shadow: none;
        }

        .btn-secondary {
            background: #e9ecef;
            color: #495057;
            box-shadow: none;
            padding: 10px;
            font-size: 0.9rem;
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

let players = [];
let questions = [];

function handleKeyPress(e) {
    if (e.key === 'Enter') {
        addPlayer();
    }
}

function addPlayer() {
    const input = document.getElementById('player-input');
    const name = input.value.trim();
    if (name && !players.includes(name)) {
        players.push(name);
        input.value = '';
        renderPlayers();
    }
}

function removePlayer(index) {
    players.splice(index, 1);
    renderPlayers();
}

function renderPlayers() {
    const list = document.getElementById('player-list');
    const startBtn = document.getElementById('start-btn');
    
    list.innerHTML = players.map((p, i) => `
        <div class="player-chip">
            ${p} <span onclick="removePlayer(${i})">✕</span>
        </div>
    `).join('');

    startBtn.disabled = players.length < 2;
    startBtn.textContent = players.length < 2 
        ? `開始遊戲 (至少需要2人，目前${players.length}人)` 
        : `開始遊戲 (${players.length} 位玩家)`;
}

function startGame() {
    questions = [...originalQuestions];
    // 洗牌算法 (Fisher-Yates Shuffle)
    for (let i = questions.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [questions[i], questions[j]] = [questions[j], questions[i]];
    }

    document.getElementById('setup-panel').classList.add('hidden');
    document.getElementById('game-panel').classList.remove('hidden');
    
    resetCardUI();
}

function drawCard() {
    if (questions.length === 0) return;

    // 隨機抽取玩家
    const randomPlayer = players[Math.floor(Math.random() * players.length)];
    const q = questions.pop();

    const targetBox = document.getElementById('target-player-box');
    const nameEl = document.getElementById('current-player-name');
    const remainingEl = document.getElementById('remaining-count');
    const tagEl = document.getElementById('card-tag');
    const contentEl = document.getElementById('card-content');
    const drawBtn = document.getElementById('draw-btn');

    targetBox.style.display = 'block';
    nameEl.textContent = randomPlayer;
    remainingEl.textContent = questions.length;
    tagEl.textContent = q.tag;
    contentEl.textContent = q.text;

    if (questions.length === 0) {
        tagEl.textContent = "遊戲結束";
        contentEl.textContent = "🎉 所有 100 道戀愛題目已抽完！希望大家更了解彼此！";
        drawBtn.disabled = true;
        drawBtn.textContent = "題目已抽完";
    }
}

function resetCardUI() {
    document.getElementById('remaining-count').textContent = questions.length;
    document.getElementById('target-player-box').style.display = 'none';
    document.getElementById('card-tag').textContent = "點擊抽牌";
    document.getElementById('card-content').innerHTML = "準備好了嗎？<br>點擊下方按鈕隨機抽取玩家與題目！";
    
    const drawBtn = document.getElementById('draw-btn');
    drawBtn.disabled = false;
    drawBtn.textContent = "🎲 隨機抽牌與玩家";
}

function resetToSetup() {
    if (confirm("確定要重設遊戲嗎？這將回到玩家設定頁面。")) {
        document.getElementById('game-panel').classList.add('hidden');
        document.getElementById('setup-panel').classList.remove('hidden');
    }
}
</script>
